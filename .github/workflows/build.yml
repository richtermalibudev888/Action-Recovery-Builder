name: build ofrp (testing)

on:
  workflow_dispatch:
  
jobs:
  build:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      actions: write
      id-token: write
    
    strategy:
      fail-fast: false      
      matrix:
        target: [dm1q, dm2q, dm3q, q5q, gts9, gts9p, gts9u]

    steps:
    
    - name: Check out
      uses: actions/checkout@v6

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main
    
    - name: Set TimeZones
      run: |
        sudo timedatectl set-timezone Asia/Ho_Chi_Minh
        sudo dpkg-reconfigure tzdata
        echo "date=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%dㅤ%H:%M)"
    
    - name: Prepare the environment
      run: |
        sudo apt update
        sudo apt -y upgrade
        sudo apt -y install ccache gperf gcc-multilib gcc-10-multilib g++-multilib g++-10-multilib libc6-dev x11proto-core-dev libx11-dev tree lib32z-dev libgl1-mesa-dev libxml2-utils xsltproc bc ccache lib32readline-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev lz4 tar libxml2 lzop pngcrush schedtool squashfs-tools imagemagick libbz2-dev lzma ncftp qemu-user-static libstdc++-10-dev python3
      continue-on-error: true
        
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 1

    - name: Install openjdk
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '11'    

    - name: Install repo
      run: |
        mkdir ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        sudo ln -sf ~/bin/repo /usr/bin/repo

    - name: Init repo
      run: |
        export HOME=${GITHUB_WORKSPACE}
        cd ${GITHUB_WORKSPACE}
        chmod +x *
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
    - name: Repo sync
      run: |
        mkdir ~/Magisk
        curl -L https://github.com/topjohnwu/Magisk/releases/download/v30.7/Magisk-v30.7.apk -o ~/Magisk/Magisk-v30.7.zip
        mkdir -p ~/OrangeFox_sync
        cd ~/OrangeFox_sync
        git clone https://github.com/richtermalibudev888/orangefox_temporary_sync_403 sync
        cd sync
        ./orangefox_sync.sh --branch 12.1 --path ~/fox_12.1

    - name: Clone device tree
      run: |
        cd ~/fox_12.1
        git clone -b android-12.1 https://github.com/richtermalibudev888/android_device_samsung_${{ matrix.target }}.git device/samsung/${{ matrix.target }} > /dev/null 2>&1
        
    - name: Clone common tree
      run: |
        cd ~/fox_12.1
        git clone -b fox_12.1 https://github.com/richtermalibudev888/android_device_samsung_sm8550-common.git device/samsung/sm8550-common > /dev/null 2>&1
    
    - name: Building recovery
      id: twrp
      run: |       
        cd ${GITHUB_WORKSPACE}
        cp build.sh ~/fox_12.1
        cd ~/fox_12.1
        export TERM=xterm
        export BUILD_USERNAME="richter"
        export BUILD_HOSTNAME="malibu"
        ./build.sh ${{ matrix.target }} 1

    - name: Set variables
      run: |
        echo "date=$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%dㅤ%H:%M)" >> $GITHUB_OUTPUT
        echo "Outdir=${GITHUB_WORKSPACE}" >> $GITHUB_OUTPUT
        export ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION=true
      id: var

    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        body: ${{ steps.var.outputs.date }}
        tag_name: "${{ github.run_id }}"
        name: "Unofficial OrangeFox Release"
        fail_on_unmatched_files: true
        files: |
          /home/runner/fox_12.1/out/target/product/${{ matrix.target }}/OrangeFox-R12.0_0-Beta-${{ matrix.target }}.zip
